[project]
name = "career-kit-e2e"
version = "0.1.0"
description = "End-to-end tests: the real page and servers, on a copy of the checkout, in a real browser."
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.uv]
package = false
# Same rule as api/ and web/: ignore releases younger than 3 days.
exclude-newer = "3 days"

[dependency-groups]
dev = [
    # 1.58 drives Chromium 1208; `uv run playwright install chromium` fetches it if it is not cached.
    "playwright==1.58.0",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
markers = ["phone_too: run at phone width as well as on the Mac"]
