[project]
name = "writekit"
version = "0.1.0"
description = "What every writer shares: its database, its app, its errors and its forms. See docs/writers.md."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.141.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
# Same rule as api/ and web/: ignore releases younger than 3 days.
exclude-newer = "3 days"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "pytest==9.1.1",
]
